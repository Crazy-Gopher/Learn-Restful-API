services:
  userapp_django:
    build: .
    container_name: userapp_django
    restart: on-failure
    depends_on:
      postgres_django:
        condition: service_healthy
    ports:
      - 8000:8000
    volumes:
         - api:/usr/src/app/
    networks:
      - fullstack
    # command: /app/test.sh local
    # env_file: .env

  postgres_django:
    image: postgres:16
    container_name: postgres_django
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    volumes:
      - database_postgres:/var/lib/postgresql/data
    networks:
      - fullstack

volumes:
  api:
  database_postgres:

networks:
  fullstack:
