apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fastapi-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: kapjain/fastapi:latest
        resources:
          requests:
            memory: "500Mi"
            cpu: "500m"
          limits:
            memory: "500Mi"
            cpu: "500m"
        ports:
        - containerPort: 8000
      restartPolicy: Always
